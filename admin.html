<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fov.it — Admin Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
    .navbar { background: #141414; border-bottom: 1px solid #222; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .logo { color: #00ff88; font-size: 20px; font-weight: bold; }
    .user-info { display: flex; align-items: center; gap: 16px; font-size: 13px; color: #aaa; }
    .badge { background: #ff4444; color: #fff; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
    .back-btn { background: #222; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; text-decoration: none; }
    .back-btn:hover { background: #333; }
    .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
    h1 { color: #ff4444; font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #666; font-size: 13px; margin-bottom: 32px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid #222; }
    .tab { padding: 12px 24px; background: transparent; color: #666; border: none; cursor: pointer; font-size: 14px; font-weight: bold; border-bottom: 2px solid transparent; }
    .tab.active { color: #00ff88; border-bottom-color: #00ff88; }
    .tab:hover { color: #fff; }
    .table { width: 100%; border-collapse: collapse; background: #141414; border-radius: 8px; overflow: hidden; }
    .table thead { background: #1a1a1a; }
    .table th { text-align: left; padding: 14px 16px; font-size: 12px; color: #00ff88; text-transform: uppercase; border-bottom: 1px solid #222; }
    .table td { padding: 14px 16px; font-size: 13px; color: #ccc; border-bottom: 1px solid #1a1a1a; }
    .table tbody tr:hover { background: #1a1a1a; }
    .role-badge { padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
    .role-owner { background: #ff4444; color: #fff; }
    .role-user { background: #00ff88; color: #0a0a0a; }
    .btn { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 11px; font-weight: bold; text-decoration: none; display: inline-block; }
    .btn-view { background: #222; color: #00ff88; }
    .btn-view:hover { background: #00ff88; color: #0a0a0a; }
    .btn-delete { background: #222; color: #ff4444; }
    .btn-delete:hover { background: #ff4444; color: #fff; }
    .empty { text-align: center; color: #666; padding: 60px 20px; background: #141414; border: 1px dashed #222; border-radius: 8px; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #00ff88; color: #0a0a0a; padding: 12px 20px; border-radius: 6px; font-weight: bold; display: none; z-index: 999; }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="logo">Fov.it Admin</div>
    <div class="user-info">
      <span id="adminName">...</span>
      <span class="badge">ADMIN</span>
      <a href="/dashboard.html" class="back-btn">← Back to Dashboard</a>
    </div>
  </div>

  <div class="container">
    <h1>🔐 Admin Panel</h1>
    <p class="subtitle">Owner-only access. Nakikita mo lahat ng users at scripts.</p>

    <div class="tabs">
      <button class="tab active" onclick="showTab('users')">👥 Users</button>
      <button class="tab" onclick="showTab('scripts')">📋 All Scripts</button>
    </div>

    <div id="usersTab"></div>
    <div id="scriptsTab" style="display:none;"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const token = localStorage.getItem('fov_token');
    const user = JSON.parse(localStorage.getItem('fov_user') || '{}');

    if (!token) window.location.href = '/';
    if (user.role !== 'owner') {
      alert('Owner only!');
      window.location.href = '/dashboard.html';
    }

    document.getElementById('adminName').textContent = user.name || '?';

    async function loadUsers() {
      const tab = document.getElementById('usersTab');
      tab.innerHTML = '<div class="empty">Loading...</div>';
      try {
        const res = await fetch('/api/admin/users', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        if (data.users.length === 0) {
          tab.innerHTML = '<div class="empty">Walang users.</div>';
          return;
        }

        tab.innerHTML = `
          <table class="table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Gmail</th>
                <th>Age</th>
                <th>Role</th>
                <th>Scripts</th>
                <th>Joined</th>
              </tr>
            </thead>
            <tbody>
              ${data.users.map(u => `
                <tr>
                  <td><strong>${escapeHtml(u.name)}</strong></td>
                  <td>${escapeHtml(u.gmail)}</td>
                  <td>${u.age}</td>
                  <td><span class="role-badge role-${u.role}">${u.role}</span></td>
                  <td>${u.script_count}</td>
                  <td>${new Date(u.created_at).toLocaleString()}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (err) {
        tab.innerHTML = '<div class="empty">Error: ' + err.message + '</div>';
      }
    }

    async function loadScripts() {
      const tab = document.getElementById('scriptsTab');
      tab.innerHTML = '<div class="empty">Loading...</div>';
      try {
        const res = await fetch('/api/admin/scripts', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        if (data.scripts.length === 0) {
          tab.innerHTML = '<div class="empty">Walang scripts.</div>';
          return;
        }

        tab.innerHTML = `
          <table class="table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Owner</th>
                <th>Gmail</th>
                <th>Link</th>
                <th>Updated</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${data.scripts.map(s => `
                <tr>
                  <td><strong>${escapeHtml(s.title)}</strong></td>
                  <td>${escapeHtml(s.owner_name)}</td>
                  <td>${escapeHtml(s.owner_gmail)}</td>
                  <td>/s/${s.public_link}</td>
                  <td>${new Date(s.updated_at).toLocaleString()}</td>
                  <td>
                    <a href="/editor.html?id=${s.id}" class="btn btn-view">✏️ Edit</a>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (err) {
        tab.innerHTML = '<div class="empty">Error: ' + err.message + '</div>';
      }
    }

    function showTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      
      if (name === 'users') {
        document.getElementById('usersTab').style.display = 'block';
        document.getElementById('scriptsTab').style.display = 'none';
        loadUsers();
      } else {
        document.getElementById('usersTab').style.display = 'none';
        document.getElementById('scriptsTab').style.display = 'block';
        loadScripts();
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    loadUsers();
  </script>
</body>
</html>
