<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fov.it — Editor</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #00ff88;
      --primary-dark: #00cc6a;
      --bg: #050505;
      --text: #fff;
      --text-muted: #666;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 255, 136, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 255, 136, 0.05) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }
    
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 { width: 400px; height: 400px; background: #00ff88; top: -100px; left: -100px; animation: float1 15s ease-in-out infinite; }
    .orb-2 { width: 300px; height: 300px; background: #00cc6a; bottom: -50px; right: -50px; animation: float2 12s ease-in-out infinite; }
    
    @keyframes float1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(100px, 100px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-80px, -60px); }
    }
    
    .navbar {
      background: rgba(10, 10, 10, 0.7);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, #00ff88 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }
    
    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      color: #0a0a0a;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
    }
    
    .back-btn {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s;
      font-family: inherit;
    }
    .back-btn:hover { background: rgba(255, 255, 255, 0.1); transform: translateX(-3px); }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 32px;
      position: relative;
      z-index: 1;
    }
    
    .page-title {
      margin-bottom: 32px;
      animation: fadeUp 0.6s ease;
    }
    
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .page-title h1 {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -1.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 0%, #00ff88 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .page-title p { color: #666; font-size: 14px; }
    
    .form-card {
      background: linear-gradient(135deg, rgba(20, 20, 20, 0.9), rgba(15, 15, 15, 0.9));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 40px;
      animation: fadeUp 0.6s ease 0.1s both;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    
    .form-group { margin-bottom: 24px; }
    
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: #aaa;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    input, textarea {
      width: 100%;
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      transition: all 0.3s;
    }
    
    input:focus, textarea:focus {
      border-color: #00ff88;
      box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
      background: rgba(0, 0, 0, 0.7);
    }
    
    input::placeholder, textarea::placeholder { color: #444; }
    
    textarea {
      min-height: 400px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      line-height: 1.7;
      resize: vertical;
    }
    
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }
    
    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      letter-spacing: 0.5px;
    }
    
    .btn-save {
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      color: #0a0a0a;
      box-shadow: 0 10px 40px rgba(0, 255, 136, 0.3);
      flex: 1;
      justify-content: center;
    }
    .btn-save:hover { transform: translateY(-3px); box-shadow: 0 20px 60px rgba(0, 255, 136, 0.5); }
    .btn-save:disabled { background: #444; color: #888; cursor: not-allowed; transform: none; box-shadow: none; }
    
    .btn-cancel {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-cancel:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-3px); }
    
    .raw-link-box {
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.1), rgba(0, 255, 136, 0.05));
      border: 1px solid rgba(0, 255, 136, 0.3);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      display: none;
      animation: fadeUp 0.5s ease;
    }
    .raw-link-box.show { display: block; }
    .raw-link-box h3 {
      color: #00ff88;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .raw-link-box code {
      display: block;
      background: rgba(0, 0, 0, 0.5);
      padding: 12px 16px;
      border-radius: 10px;
      color: #00ff88;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      word-break: break-all;
      margin-bottom: 8px;
      border: 1px solid rgba(0, 255, 136, 0.2);
    }
    
    .error {
      background: linear-gradient(135deg, rgba(255, 68, 68, 0.15), rgba(255, 68, 68, 0.05));
      border: 1px solid rgba(255, 68, 68, 0.3);
      color: #ff8888;
      padding: 14px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      animation: shake 0.5s ease;
    }
    .error.show { display: block; }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
    
    .toast {
      position: fixed;
      bottom: 32px;
      right: 32px;
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      color: #0a0a0a;
      padding: 16px 28px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 14px;
      display: none;
      z-index: 999;
      box-shadow: 0 20px 60px rgba(0, 255, 136, 0.5);
      animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes slideIn {
      from { transform: translateX(200px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    @media (max-width: 768px) {
      .container { padding: 32px 20px; }
      .form-card { padding: 24px; }
      .page-title h1 { font-size: 28px; }
      .navbar { padding: 14px 20px; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="navbar">
    <a href="/dashboard.html" class="logo">
      <div class="logo-icon">F</div>
      Fov.it
    </a>
    <a href="/dashboard.html" class="back-btn">← Back</a>
  </div>

  <div class="container">
    <div class="page-title">
      <h1 id="pageTitle">✨ New Script</h1>
      <p id="pageSubtitle">Create a new protected Lua script</p>
    </div>

    <div class="error" id="error"></div>
    <div class="raw-link-box" id="rawBox"></div>

    <div class="form-card">
      <form id="editorForm">
        <div class="form-group">
          <label>📝 Script Name (Title)</label>
          <input type="text" id="title" required placeholder="Enter script name">
        </div>

        <div class="form-group">
          <label>💻 Script Content (Lua)</label>
          <textarea id="content" required placeholder="-- Paste your Lua script here..."></textarea>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-save" id="saveBtn">💾 Save</button>
          <a href="/dashboard.html" class="btn btn-cancel">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast">Saved!</div>

  <script>
    const token = localStorage.getItem('fov_token');
    if (!token) window.location.href = '/';

    const params = new URLSearchParams(window.location.search);
    const editId = params.get('id');

    if (editId) {
      document.getElementById('pageTitle').textContent = '✏️ Edit Script';
      document.getElementById('pageSubtitle').textContent = 'Update your script';
      loadScript(editId);
    }

    async function loadScript(id) {
      try {
        const res = await fetch('/api/single?id=' + id, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        document.getElementById('title').value = data.script.title;
        document.getElementById('content').value = data.script.content;
        const rawLink = window.location.origin + '/api/raw?id=' + data.script.public_link;
        const viewLink = rawLink + '&token=' + token;
        const rawBox = document.getElementById('rawBox');
        rawBox.classList.add('show');
        rawBox.innerHTML = `
          <h3>🔗 Raw Link (Roblox)</h3>
          <code>loadstring(game:HttpGet("${rawLink}"))()</code>
          <h3 style="margin-top: 12px;">👁️ View Link (Browser)</h3>
          <code>${viewLink}</code>
        `;
      } catch (err) {
        const errorBox = document.getElementById('error');
        errorBox.textContent = '❌ ' + err.message;
        errorBox.classList.add('show');
      }
    }

    document.getElementById('editorForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      const errorBox = document.getElementById('error');
      btn.disabled = true;
      btn.textContent = '⏳ Saving...';
      errorBox.classList.remove('show');

      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value;

      try {
        let res;
        if (editId) {
          res = await fetch('/api/edit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ id: editId, title, content })
          });
        } else {
          res = await fetch('/api/upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ title, content })
          });
        }

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to save');

        if (data.script && data.script.public_link) {
          const rawLink = window.location.origin + '/api/raw?id=' + data.script.public_link;
          const viewLink = rawLink + '&token=' + token;
          const rawBox = document.getElementById('rawBox');
          rawBox.classList.add('show');
          rawBox.innerHTML = `
            <h3>✅ Saved! Raw Link (Roblox)</h3>
            <code>loadstring(game:HttpGet("${rawLink}"))()</code>
            <h3 style="margin-top: 12px;">👁️ View Link (Browser)</h3>
            <code>${viewLink}</code>
          `;
        }

        showToast('✅ ' + (editId ? 'Updated!' : 'Created!'));
        setTimeout(() => window.location.href = '/dashboard.html', 2000);
      } catch (err) {
        errorBox.textContent = '❌ ' + err.message;
        errorBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = '💾 Save';
      }
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2500);
    }
  </script>
</body>
</html>
