<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fov.it — Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
    .navbar { background: #141414; border-bottom: 1px solid #222; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .logo { color: #00ff88; font-size: 20px; font-weight: bold; }
    .back-btn { background: #222; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .back-btn:hover { background: #333; }
    .container { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
    h1 { color: #fff; font-size: 24px; margin-bottom: 24px; }
    label { display: block; margin-bottom: 6px; color: #aaa; font-size: 13px; }
    input, textarea { width: 100%; padding: 12px; background: #141414; border: 1px solid #222; border-radius: 6px; color: #fff; font-size: 14px; outline: none; font-family: inherit; }
    input:focus, textarea:focus { border-color: #00ff88; }
    input { margin-bottom: 18px; }
    textarea { min-height: 400px; font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; line-height: 1.6; resize: vertical; margin-bottom: 18px; }
    .actions { display: flex; gap: 12px; }
    button { padding: 12px 24px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-save { background: #00ff88; color: #0a0a0a; }
    .btn-save:hover { background: #00cc6a; }
    .btn-cancel { background: #222; color: #fff; }
    .btn-cancel:hover { background: #333; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #00ff88; color: #0a0a0a; padding: 12px 20px; border-radius: 6px; font-weight: bold; display: none; z-index: 999; }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="logo">Fov.it</div>
    <button class="back-btn" onclick="window.location.href='/dashboard.html'">← Back</button>
  </div>
  <div class="container">
    <h1 id="pageTitle">Bagong Script</h1>
    <form id="editorForm">
      <label>Title</label>
      <input type="text" id="title" required placeholder="Pangalan ng script">
      <label>Script Content (Lua)</label>
      <textarea id="content" required placeholder="-- I-paste ang Lua script dito..."></textarea>
      <div class="actions">
        <button type="submit" class="btn-save">I-save</button>
        <button type="button" class="btn-cancel" onclick="window.location.href='/dashboard.html'">Cancel</button>
      </div>
    </form>
  </div>
  <div class="toast" id="toast">Saved!</div>
  <script>
    const token = localStorage.getItem('fov_token');
    const user = JSON.parse(localStorage.getItem('fov_user') || '{}');
    if (!token) window.location.href = '/';

    const params = new URLSearchParams(window.location.search);
    const editId = params.get('id');
    let scripts = JSON.parse(localStorage.getItem('fov_scripts') || '[]');

    if (editId) {
      document.getElementById('pageTitle').textContent = 'I-edit ang Script';
      const script = scripts.find(s => s.id === editId);
      if (script) {
        document.getElementById('title').value = script.title;
        document.getElementById('content').value = script.content;
      }
    }

    document.getElementById('editorForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value;

      if (editId) {
        const script = scripts.find(s => s.id === editId);
        if (script) {
          script.title = title;
          script.content = content;
        }
      } else {
        scripts.push({
          id: 'id_' + Date.now(),
          title: title,
          content: content,
          link: Math.random().toString(36).substring(2, 12),
          owner: user.name || 'you',
          created: new Date().toISOString()
        });
      }

      localStorage.setItem('fov_scripts', JSON.stringify(scripts));
      showToast(editId ? 'Updated!' : 'Created!');
      setTimeout(() => window.location.href = '/dashboard.html', 1000);
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2500);
    }
  </script>
</body>
</html>
