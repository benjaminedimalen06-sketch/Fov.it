<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fov.it — Script</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { background: #141414; padding: 40px; border-radius: 12px; border: 1px solid #222; width: 100%; max-width: 800px; }
    .logo { color: #00ff88; font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #666; font-size: 12px; margin-bottom: 30px; }
    h1 { color: #fff; font-size: 22px; margin-bottom: 20px; text-align: center; }
    .protected-box { background: #1a0a0a; border: 2px solid #ff4444; color: #ff6666; padding: 40px 20px; border-radius: 8px; text-align: center; }
    .protected-box .lock { font-size: 48px; margin-bottom: 16px; }
    .protected-box .msg { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
    .protected-box .desc { font-size: 13px; color: #aa6666; }
    pre { background: #0a0a0a; border: 1px solid #222; padding: 20px; border-radius: 8px; font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; line-height: 1.6; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; max-height: 500px; overflow-y: auto; }
    .meta { text-align: center; color: #666; font-size: 12px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #222; }
    .meta a { color: #00ff88; text-decoration: none; }

    /* ===== LOADSTRING BOX ===== */
    .loadstring-box {
      margin-top: 20px;
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.1), rgba(0, 255, 136, 0.05));
      border: 1px solid rgba(0, 255, 136, 0.3);
      border-radius: 12px;
      padding: 20px;
    }
    .loadstring-box h3 {
      color: #00ff88;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .loadstring-code {
      display: block;
      background: rgba(0, 0, 0, 0.6);
      padding: 14px 16px;
      border-radius: 8px;
      color: #00ff88;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      word-break: break-all;
      border: 1px solid rgba(0, 255, 136, 0.2);
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .copy-loadstring-btn {
      display: block;
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      color: #0a0a0a;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
    }
    .copy-loadstring-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 255, 136, 0.4);
    }
    .copy-loadstring-btn:active { transform: translateY(0); }
    .copy-loadstring-btn.copied {
      background: #00cc6a;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Fov.it</div>
    <div class="subtitle">Script Protection System</div>
    <h1 id="title">Script</h1>
    <div id="contentArea"></div>
    <div class="meta">Protektado ng <a href="/">Fov.it</a></div>
  </div>
  <script>
    const user = JSON.parse(localStorage.getItem('fov_user') || '{}');
    const token = localStorage.getItem('fov_token');
    const path = window.location.pathname;
    const link = path.split('/s/')[1];
    const titleEl = document.getElementById('title');
    const contentEl = document.getElementById('contentArea');

    // Default — hindi na "Loading..."
    titleEl.textContent = 'Script';

    if (!link) {
      titleEl.textContent = 'Invalid Link';
      contentEl.innerHTML = '<div class="protected-box"><div class="lock">⚠️</div><div class="msg">Walang link</div></div>';
    } else {
      const scripts = JSON.parse(localStorage.getItem('fov_scripts') || '[]');
      const localScript = scripts.find(s => s.link === link);

      if (localScript) {
        renderScript(localScript);
      } else {
        loadScriptFromAPI(link);
      }
    }

    // ===== KUNAIN ANG SCRIPT MULA SA API =====
    async function loadScriptFromAPI(link) {
      try {
        const res = await fetch('/api/single?public_link=' + encodeURIComponent(link), {
          headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });

        if (!res.ok) {
          titleEl.textContent = 'Not Found';
          contentEl.innerHTML = '<div class="protected-box"><div class="lock">❌</div><div class="msg">Script not found</div></div>';
          return;
        }

        const data = await res.json();
        renderScript({
          title: data.script.title,
          content: data.script.content,
          owner: data.script.user_id,
          link: link
        });

      } catch (err) {
        titleEl.textContent = 'Error';
        contentEl.innerHTML = '<div class="protected-box"><div class="lock">❌</div><div class="msg">Error loading script</div></div>';
      }
    }

    // ===== I-RENDER ANG SCRIPT =====
    function renderScript(script) {
      titleEl.textContent = script.title;
      const isOwner = user.role === 'owner' || user.name === script.owner;

      if (isOwner) {
        // Build loadstring
        const rawLink = window.location.origin + '/api/raw-exec?id=' + script.link;
        const loadstring = `loadstring(game:HttpGet("${rawLink}"))()`;

        contentEl.innerHTML = `
          <pre>${escapeHtml(script.content)}</pre>

          <div class="loadstring-box">
            <h3>🚀 Copy Loadstring (for Executor)</h3>
            <code class="loadstring-code" id="loadstringCode">${escapeHtml(loadstring)}</code>
            <button type="button" class="copy-loadstring-btn" onclick="copyLoadstring(this)">
              📋 Copy Loadstring
            </button>
          </div>
        `;
      } else {
        contentEl.innerHTML = `
          <div class="protected-box">
            <div class="lock">🔒</div>
            <div class="msg">This script is in protection</div>
            <div class="desc">Hindi mo maaaring makita ang script na ito.</div>
          </div>
        `;
      }
    }

    // ===== COPY LOADSTRING FUNCTION =====
    async function copyLoadstring(btn) {
      const text = document.getElementById('loadstringCode').textContent;
      try {
        await navigator.clipboard.writeText(text);
        btn.textContent = '✅ Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = '📋 Copy Loadstring';
          btn.classList.remove('copied');
        }, 2000);
      } catch (err) {
        // Fallback
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        btn.textContent = '✅ Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = '📋 Copy Loadstring';
          btn.classList.remove('copied');
        }, 2000);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
