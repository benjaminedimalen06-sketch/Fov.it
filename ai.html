<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fov.it — AI Generator</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #050505; color: #fff; min-height: 100vh; position: relative; overflow-x: hidden; }
    body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at 20% 20%, rgba(0, 255, 136, 0.08) 0%, transparent 40%), radial-gradient(circle at 80% 80%, rgba(167, 139, 250, 0.05) 0%, transparent 40%); pointer-events: none; z-index: 0; }
    .navbar { background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(30px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 900; letter-spacing: -0.5px; background: linear-gradient(135deg, #fff 0%, #00ff88 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-decoration: none; }
    .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #00ff88, #00cc6a); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; color: #0a0a0a; box-shadow: 0 0 30px rgba(0, 255, 136, 0.5); }
    .back-btn { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.3s; font-family: inherit; }
    .back-btn:hover { background: rgba(255, 255, 255, 0.1); transform: translateX(-3px); }
    .container { max-width: 1100px; margin: 0 auto; padding: 48px 32px; position: relative; z-index: 1; }
    .page-title { text-align: center; margin-bottom: 40px; animation: fadeUp 0.6s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .page-title h1 { font-size: 42px; font-weight: 900; letter-spacing: -1.5px; margin-bottom: 12px; background: linear-gradient(135deg, #fff 0%, #a78bfa 50%, #00ff88 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: shine 4s linear infinite; }
    @keyframes shine { to { background-position: 200% center; } }
    .page-title p { color: #666; font-size: 15px; }
    .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap; }
    .tab { background: rgba(255, 255, 255, 0.05); color: #aaa; border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 700; transition: all 0.3s; font-family: inherit; }
    .tab:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .tab.active { background: linear-gradient(135deg, #00ff88, #00cc6a); color: #0a0a0a; border-color: transparent; box-shadow: 0 0 30px rgba(0, 255, 136, 0.4); }
    .form-card { background: linear-gradient(135deg, rgba(20, 20, 20, 0.9), rgba(15, 15, 15, 0.9)); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; padding: 40px; animation: fadeUp 0.6s ease 0.1s both; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
    .form-group { margin-bottom: 24px; }
    label { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: #aaa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    select, textarea { width: 100%; padding: 16px 20px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #fff; font-size: 14px; outline: none; font-family: inherit; transition: all 0.3s; }
    select:focus, textarea:focus { border-color: #00ff88; box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1); background: rgba(0, 0, 0, 0.7); }
    select option { background: #141414; }
    textarea { min-height: 200px; font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; line-height: 1.7; resize: vertical; }
    textarea::placeholder { color: #444; }
    .btn { padding: 16px 32px; border: none; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; transition: all 0.3s; font-family: inherit; display: inline-flex; align-items: center; gap: 8px; letter-spacing: 0.5px; }
    .btn-primary { background: linear-gradient(135deg, #00ff88, #00cc6a); color: #0a0a0a; width: 100%; justify-content: center; box-shadow: 0 10px 40px rgba(0, 255, 136, 0.3); }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 20px 60px rgba(0, 255, 136, 0.5); }
    .btn-primary:disabled { background: #444; color: #888; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-copy { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-copy:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-3px); }
    .output-box { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 255, 136, 0.3); border-radius: 12px; padding: 20px; margin-top: 24px; min-height: 200px; font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; line-height: 1.7; color: #00ff88; white-space: pre-wrap; word-break: break-word; overflow-x: auto; display: none; }
    .output-box.show { display: block; animation: fadeUp 0.5s ease; }
    .output-label { color: #666; font-size: 11px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .error { background: linear-gradient(135deg, rgba(255, 68, 68, 0.15), rgba(255, 68, 68, 0.05)); border: 1px solid rgba(255, 68, 68, 0.3); color: #ff8888; padding: 14px 20px; border-radius: 12px; margin-bottom: 20px; font-size: 13px; font-weight: 600; display: none; }
    .error.show { display: block; }
    .toast { position: fixed; bottom: 32px; right: 32px; background: linear-gradient(135deg, #00ff88, #00cc6a); color: #0a0a0a; padding: 16px 28px; border-radius: 14px; font-weight: 800; font-size: 14px; display: none; z-index: 999; box-shadow: 0 20px 60px rgba(0, 255, 136, 0.5); }
    .loading { display: none; text-align: center; padding: 40px; color: #00ff88; }
    .loading.show { display: block; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(0, 255, 136, 0.2); border-top-color: #00ff88; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .history-header h2 { font-size: 20px; font-weight: 800; }
    .clear-history-btn { background: rgba(255, 68, 68, 0.1); color: #ff6666; border: 1px solid rgba(255, 68, 68, 0.3); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 700; transition: all 0.3s; font-family: inherit; }
    .clear-history-btn:hover { background: #ff4444; color: #fff; }
    .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .history-card { background: linear-gradient(135deg, rgba(20, 20, 20, 0.9), rgba(15, 15, 15, 0.9)); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 20px; transition: all 0.3s; position: relative; overflow: hidden; animation: fadeUp 0.5s ease; }
    .history-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, #a78bfa, #7c3aed); }
    .history-card:hover { transform: translateY(-4px); border-color: rgba(167, 139, 250, 0.4); box-shadow: 0 15px 40px rgba(167, 139, 250, 0.15); }
    .history-card .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 11px; color: #666; }
    .history-card .lang-badge { background: rgba(167, 139, 250, 0.15); color: #a78bfa; padding: 3px 10px; border-radius: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .history-card .prompt-text { color: #fff; font-size: 13px; font-weight: 600; margin-bottom: 12px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .history-card .code-preview { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 12px; font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; color: #888; height: 80px; overflow: hidden; margin-bottom: 12px; white-space: pre-wrap; word-break: break-all; }
    .history-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .history-actions .btn { padding: 8px 12px; font-size: 10px; border-radius: 8px; flex: 1; justify-content: center; }
    .empty-history { text-align: center; color: #666; padding: 60px 20px; background: rgba(20, 20, 20, 0.5); border: 1px dashed rgba(255, 255, 255, 0.1); border-radius: 16px; }
    .empty-history .icon { font-size: 48px; margin-bottom: 12px; }
    @media (max-width: 768px) {
      .container { padding: 32px 20px; }
      .form-card { padding: 24px; }
      .page-title h1 { font-size: 28px; }
      .navbar { padding: 14px 20px; }
      .history-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/dashboard.html" class="logo">
      <div class="logo-icon">F</div>
      Fov.it
    </a>
    <a href="/dashboard.html" class="back-btn">← Back to Dashboard</a>
  </div>
  <div class="container">
    <div class="page-title">
      <h1>🤖 AI Script Generator</h1>
      <p>Powered by Google Gemini</p>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('generate', this)">✨ Generate</button>
      <button class="tab" onclick="switchTab('explain', this)">📖 Explain</button>
      <button class="tab" onclick="switchTab('fix', this)">🔧 Fix</button>
      <button class="tab" onclick="switchTab('optimize', this)">⚡ Optimize</button>
      <button class="tab" onclick="switchTab('history', this)">📜 History</button>
    </div>

    <div class="form-card" id="aiForm">
      <div class="error" id="error"></div>
      <div class="form-group">
        <label>🌐 Language</label>
        <select id="language">
          <option value="javascript">JavaScript</option>
          <option value="lua">Lua (Roblox)</option>
          <option value="python">Python</option>
          <option value="html">HTML/CSS</option>
          <option value="typescript">TypeScript</option>
        </select>
      </div>
      <div class="form-group">
        <label id="promptLabel">💬 Prompt (Describe what you want)</label>
        <textarea id="prompt" placeholder="Example: Create a function that adds two numbers..."></textarea>
      </div>
      <button class="btn btn-primary" id="generateBtn" onclick="generate()">
        <span id="btnText">🚀 Generate Script</span>
      </button>
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>AI is thinking...</div>
      </div>
      <div id="outputSection" style="display:none;">
        <div class="output-label">📄 Result</div>
        <div class="output-box show" id="output"></div>
        <div style="display:flex; gap:12px; margin-top:16px; flex-wrap:wrap;">
          <button class="btn btn-copy" onclick="copyOutput()">📋 Copy</button>
          <button class="btn btn-copy" onclick="saveToEditor()">💾 Save to Editor</button>
        </div>
      </div>
    </div>

    <div id="historySection" style="display:none;">
      <div class="history-header">
        <h2>📜 Generation History</h2>
        <button class="clear-history-btn" onclick="clearHistory()">🗑️ Clear All</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>
  <div class="toast" id="toast">Copied!</div>

  <script>
    const token = localStorage.getItem('fov_token');
    if (!token) window.location.href = '/';

    let currentAction = 'generate';
    const HISTORY_KEY = 'fov_ai_history';

    function switchTab(action, el) {
      currentAction = action;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');

      const aiForm = document.getElementById('aiForm');
      const historySection = document.getElementById('historySection');

      if (action === 'history') {
        aiForm.style.display = 'none';
        historySection.style.display = 'block';
        renderHistory();
        return;
      }

      aiForm.style.display = 'block';
      historySection.style.display = 'none';

      const labels = {
        generate: '💬 Prompt (Describe what you want)',
        explain: '📖 Code (Paste code to explain)',
        fix: '🔧 Code (Paste code with errors)',
        optimize: '⚡ Code (Paste code to optimize)'
      };
      const placeholders = {
        generate: 'Example: Create a function that adds two numbers...',
        explain: 'Paste your code here...',
        fix: 'Paste your broken code here...',
        optimize: 'Paste your code here...'
      };
      const btnTexts = {
        generate: '🚀 Generate Script',
        explain: '📖 Explain Code',
        fix: '🔧 Fix Code',
        optimize: '⚡ Optimize Code'
      };

      document.getElementById('promptLabel').textContent = labels[action];
      document.getElementById('prompt').placeholder = placeholders[action];
      document.getElementById('btnText').textContent = btnTexts[action];
      document.getElementById('outputSection').style.display = 'none';
      document.getElementById('error').classList.remove('show');
    }

    async function generate() {
      const prompt = document.getElementById('prompt').value.trim();
      const language = document.getElementById('language').value;
      const btn = document.getElementById('generateBtn');
      const errorBox = document.getElementById('error');
      const loading = document.getElementById('loading');
      const outputSection = document.getElementById('outputSection');

      if (!prompt) {
        errorBox.textContent = '❌ Please enter a prompt or code';
        errorBox.classList.add('show');
        return;
      }

      btn.disabled = true;
      errorBox.classList.remove('show');
      outputSection.style.display = 'none';
      loading.classList.add('show');

      try {
        const res = await fetch('/api/ai', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ prompt, language, action: currentAction })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'AI request failed');

        document.getElementById('output').textContent = data.result;
        outputSection.style.display = 'block';

        saveHistory({
          prompt: prompt,
          language: language,
          action: currentAction,
          result: data.result,
          timestamp: Date.now()
        });

      } catch (err) {
        errorBox.textContent = '❌ ' + err.message;
        errorBox.classList.add('show');
      } finally {
        btn.disabled = false;
        loading.classList.remove('show');
      }
    }

    function saveHistory(item) {
      try {
        let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
        history.unshift(item);
        if (history.length > 50) history = history.slice(0, 50);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      } catch (e) { console.error('Failed to save history:', e); }
    }

    function getHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
      catch (e) { return []; }
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      const history = getHistory();

      if (history.length === 0) {
        list.innerHTML = `<div class="empty-history"><div class="icon">📭</div><h3>No history yet</h3><p>Your generated scripts will appear here.</p></div>`;
        return;
      }

      list.innerHTML = `
        <div class="history-grid">
          ${history.map((item, i) => {
            const date = new Date(item.timestamp).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            return `
              <div class="history-card">
                <div class="meta">
                  <span class="lang-badge">${item.language}</span>
                  <span>${date}</span>
                </div>
                <div class="prompt-text">${escapeHtml(item.prompt)}</div>
                <div class="code-preview">${escapeHtml(item.result.substring(0, 200))}${item.result.length > 200 ? '...' : ''}</div>
                <div class="history-actions">
                  <button class="btn btn-copy" onclick="viewHistory(${i})">👁️ View</button>
                  <button class="btn btn-copy" onclick="copyHistory(${i})">📋 Copy</button>
                  <button class="btn btn-copy" onclick="deleteHistory(${i})">🗑️ Delete</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function viewHistory(index) {
      const history = getHistory();
      const item = history[index];
      if (!item) return;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector('.tab').classList.add('active');
      document.getElementById('aiForm').style.display = 'block';
      document.getElementById('historySection').style.display = 'none';
      document.getElementById('language').value = item.language;
      document.getElementById('prompt').value = item.prompt;
      document.getElementById('output').textContent = item.result;
      document.getElementById('outputSection').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function copyHistory(index) {
      const history = getHistory();
      const item = history[index];
      if (!item) return;
      navigator.clipboard.writeText(item.result).then(() => {
        showToast('✅ Copied!');
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = item.result;
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        showToast('✅ Copied!');
      });
    }

    function deleteHistory(index) {
      if (!confirm('Delete this from history?')) return;
      let history = getHistory();
      history.splice(index, 1);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      renderHistory();
      showToast('🗑️ Deleted!');
    }

    function clearHistory() {
      if (!confirm('Clear ALL history? This cannot be undone.')) return;
      localStorage.removeItem(HISTORY_KEY);
      renderHistory();
      showToast('🗑️ History cleared!');
    }

    function copyOutput() {
      const text = document.getElementById('output').textContent;
      navigator.clipboard.writeText(text).then(() => { showToast('✅ Copied!'); });
    }

    function saveToEditor() {
      const text = document.getElementById('output').textContent;
      localStorage.setItem('fov_ai_output', text);
      window.location.href = '/editor.html?from=ai';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2500);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }
  </script>
</body>
</html>
