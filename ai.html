<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fov.it — Chat AI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #050505; color: #fff; height: 100vh; display: flex; overflow: hidden; }
    .sidebar { width: 260px; background: #0a0a0a; border-right: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .sidebar-logo { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; background: linear-gradient(135deg, #fff 0%, #00ff88 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-decoration: none; }
    .sidebar-logo-icon { width: 24px; height: 24px; background: linear-gradient(135deg, #00ff88, #00cc6a); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; color: #0a0a0a; }
    .new-chat-btn { margin: 12px; padding: 12px; background: linear-gradient(135deg, #00ff88, #00cc6a); color: #0a0a0a; border: none; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.3s; font-family: inherit; }
    .new-chat-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 255, 136, 0.3); }
    .chat-list { flex: 1; overflow-y: auto; padding: 8px; }
    .chat-list::-webkit-scrollbar { width: 4px; }
    .chat-list::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }
    .chat-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: #aaa; margin-bottom: 4px; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .chat-item:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
    .chat-item.active { background: rgba(0, 255, 136, 0.1); color: #00ff88; }
    .chat-item-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .chat-item-delete { background: transparent; border: none; color: #666; cursor: pointer; font-size: 14px; padding: 2px 4px; border-radius: 4px; opacity: 0; transition: all 0.2s; }
    .chat-item:hover .chat-item-delete { opacity: 1; }
    .chat-item-delete:hover { color: #ff4444; background: rgba(255, 68, 68, 0.1); }
    .sidebar-footer { padding: 12px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
    .back-link { display: flex; align-items: center; gap: 6px; color: #666; text-decoration: none; font-size: 12px; padding: 8px; border-radius: 6px; transition: all 0.2s; }
    .back-link:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
    .main { flex: 1; display: flex; flex-direction: column; background: #050505; position: relative; }
    .chat-header { padding: 16px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: space-between; background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(20px); z-index: 10; }
    .chat-header-title { font-size: 14px; font-weight: 700; color: #fff; }
    .chat-header-model { font-size: 11px; color: #666; background: rgba(255, 255, 255, 0.05); padding: 4px 10px; border-radius: 6px; }
    .messages { flex: 1; overflow-y: auto; padding: 32px 24px; display: flex; flex-direction: column; gap: 20px; }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }
    .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; padding: 40px; }
    .welcome-icon { width: 64px; height: 64px; background: linear-gradient(135deg, #00ff88, #00cc6a); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 0 60px rgba(0, 255, 136, 0.3); }
    .welcome h2 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
    .welcome p { color: #666; font-size: 14px; max-width: 400px; line-height: 1.6; }
    .message { display: flex; gap: 12px; max-width: 800px; width: 100%; margin: 0 auto; animation: fadeUp 0.3s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message.user { flex-direction: row-reverse; }
    .message-avatar { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0; }
    .message.user .message-avatar { background: linear-gradient(135deg, #a78bfa, #7c3aed); color: #fff; }
    .message.ai .message-avatar { background: linear-gradient(135deg, #00ff88, #00cc6a); color: #0a0a0a; }
    .message-content { background: #141414; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 12px 16px; font-size: 14px; line-height: 1.6; color: #e0e0e0; max-width: calc(100% - 60px); word-wrap: break-word; overflow-wrap: break-word; }
    .message.user .message-content { background: linear-gradient(135deg, rgba(167, 139, 250, 0.15), rgba(124, 58, 237, 0.1)); border-color: rgba(167, 139, 250, 0.3); color: #fff; }
    .message-content pre { background: #0a0a0a; border: 1px solid rgba(0, 255, 136, 0.2); border-radius: 8px; padding: 12px; margin: 8px 0; overflow-x: auto; font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; color: #00ff88; white-space: pre-wrap; }
    .message-content code { background: #0a0a0a; padding: 2px 6px; border-radius: 4px; font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; color: #00ff88; }
    .message-content pre code { background: transparent; padding: 0; }
    .message-actions { display: flex; gap: 4px; margin-top: 8px; }
    .msg-action-btn { background: transparent; border: 1px solid rgba(255, 255, 255, 0.1); color: #888; padding: 4px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
    .msg-action-btn:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
    .typing { display: flex; gap: 4px; padding: 4px 0; }
    .typing span { width: 8px; height: 8px; background: #00ff88; border-radius: 50%; animation: bounce 1.4s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-8px); opacity: 1; } }
    .input-area { padding: 16px 24px 24px; background: #050505; border-top: 1px solid rgba(255, 255, 255, 0.05); }
    .input-wrapper { max-width: 800px; margin: 0 auto; background: #141414; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; transition: all 0.3s; }
    .input-wrapper:focus-within { border-color: rgba(0, 255, 136, 0.5); box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1); }
    .input-wrapper textarea { background: transparent; border: none; outline: none; color: #fff; font-size: 14px; font-family: inherit; resize: none; min-height: 44px; max-height: 200px; padding: 8px; line-height: 1.5; }
    .input-wrapper textarea::placeholder { color: #555; }
    .input-footer { display: flex; justify-content: space-between; align-items: center; }
    .input-hint { color: #444; font-size: 11px; }
    .send-btn { background: linear-gradient(135deg, #00ff88, #00cc6a); color: #0a0a0a; border: none; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.3s; }
    .send-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
    .send-btn:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; box-shadow: none; }
    @media (max-width: 768px) {
      .sidebar { width: 60px; }
      .sidebar .new-chat-btn span, .sidebar .chat-list, .sidebar .back-link span { display: none; }
      .sidebar .new-chat-btn { padding: 12px; }
      .messages { padding: 16px; }
      .message-content { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <a href="/dashboard.html" class="sidebar-logo">
        <div class="sidebar-logo-icon">F</div>
        Fov.it
      </a>
    </div>
    <button class="new-chat-btn" onclick="newChat()">
      <span>+</span> <span>New Chat</span>
    </button>
    <div class="chat-list" id="chatList"></div>
    <div class="sidebar-footer">
      <a href="/dashboard.html" class="back-link">
        <span>←</span> <span>Back to Dashboard</span>
      </a>
    </div>
  </div>
  <div class="main">
    <div class="chat-header">
      <div class="chat-header-title" id="chatTitle">New Chat</div>
      <div class="chat-header-model">🤖 AI Chat</div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="input" placeholder="Message AI..." rows="1" onkeydown="handleKey(event)"></textarea>
        <div class="input-footer">
          <span class="input-hint">Press Enter to send, Shift+Enter for new line</span>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    const token = localStorage.getItem('fov_token');
    if (!token) window.location.href = '/';
    const STORAGE_KEY = 'fov_chat_history';
    let chats = [];
    let currentChatId = null;
    function loadChats() {
      try { chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { chats = []; }
      renderChatList();
      if (chats.length > 0) { selectChat(chats[0].id); } else { newChat(); }
    }
    function saveChats() { localStorage.setItem(STORAGE_KEY, JSON.stringify(chats)); }
    function newChat() {
      const chat = { id: 'chat_' + Date.now(), title: 'New Chat', messages: [], createdAt: Date.now() };
      chats.unshift(chat); saveChats(); currentChatId = chat.id;
      renderChatList(); renderMessages();
      document.getElementById('chatTitle').textContent = 'New Chat';
      document.getElementById('input').focus();
    }
    function selectChat(id) {
      currentChatId = id;
      const chat = chats.find(c => c.id === id);
      if (!chat) return;
      document.getElementById('chatTitle').textContent = chat.title;
      renderChatList(); renderMessages();
    }
    function deleteChat(id, e) {
      e.stopPropagation();
      if (!confirm('Delete this chat?')) return;
      chats = chats.filter(c => c.id !== id); saveChats();
      if (currentChatId === id) {
        if (chats.length > 0) { selectChat(chats[0].id); } else { newChat(); }
      } else { renderChatList(); }
    }
    function renderChatList() {
      const list = document.getElementById('chatList');
      if (chats.length === 0) { list.innerHTML = '<div style="color: #444; font-size: 12px; padding: 12px; text-align: center;">No chats yet</div>'; return; }
      list.innerHTML = chats.map(c => `
        <div class="chat-item ${c.id === currentChatId ? 'active' : ''}" onclick="selectChat('${c.id}')">
          <div class="chat-item-text">💬 ${escapeHtml(c.title)}</div>
          <button class="chat-item-delete" onclick="deleteChat('${c.id}', event)">×</button>
        </div>
      `).join('');
    }
    function renderMessages() {
      const chat = chats.find(c => c.id === currentChatId);
      const container = document.getElementById('messages');
      if (!chat || chat.messages.length === 0) {
        container.innerHTML = `<div class="welcome"><div class="welcome-icon">🤖</div><h2>How can I help you?</h2><p>Ask me anything — coding, scripts, ideas, or just chat. I'm here to help.</p></div>`;
        return;
      }
      container.innerHTML = chat.messages.map((m, i) => `
        <div class="message ${m.role}">
          <div class="message-avatar">${m.role === 'user' ? 'Y' : 'AI'}</div>
          <div>
            <div class="message-content">${formatMessage(m.content)}</div>
            ${m.role === 'ai' ? `<div class="message-actions"><button class="msg-action-btn" onclick="copyMessage(${i})">📋 Copy</button></div>` : ''}
          </div>
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    }
    function formatMessage(text) {
      if (!text) return '';
      let html = escapeHtml(text);
      html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\n/g, '<br>');
      return html;
    }
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }
    function copyMessage(index) {
      const chat = chats.find(c => c.id === currentChatId);
      if (!chat) return;
      const msg = chat.messages[index];
      navigator.clipboard.writeText(msg.content).then(() => { alert('Copied!'); });
    }
    async function sendMessage() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;
      const chat = chats.find(c => c.id === currentChatId);
      if (!chat) return;
      chat.messages.push({ role: 'user', content: text, timestamp: Date.now() });
      if (chat.messages.length === 1) {
        chat.title = text.substring(0, 30) + (text.length > 30 ? '...' : '');
        document.getElementById('chatTitle').textContent = chat.title;
      }
      input.value = '';
      input.style.height = 'auto';
      renderMessages(); renderChatList(); saveChats();
      const container = document.getElementById('messages');
      const typingEl = document.createElement('div');
      typingEl.className = 'message ai';
      typingEl.id = 'typingIndicator';
      typingEl.innerHTML = `<div class="message-avatar">AI</div><div class="message-content"><div class="typing"><span></span><span></span><span></span></div></div>`;
      container.appendChild(typingEl);
      container.scrollTop = container.scrollHeight;
      document.getElementById('sendBtn').disabled = true;
      try {
        const res = await fetch('/api/ai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ prompt: text, action: 'chat', language: 'javascript' })
        });
        const data = await res.json();
        const typing = document.getElementById('typingIndicator');
        if (typing) typing.remove();
        if (!res.ok) throw new Error(data.error || 'AI request failed');
        chat.messages.push({ role: 'ai', content: data.result, timestamp: Date.now() });
        saveChats(); renderMessages();
      } catch (err) {
        const typing = document.getElementById('typingIndicator');
        if (typing) typing.remove();
        chat.messages.push({ role: 'ai', content: '❌ Error: ' + err.message, timestamp: Date.now() });
        saveChats(); renderMessages();
      } finally {
        document.getElementById('sendBtn').disabled = false;
        input.focus();
      }
    }
    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }
    document.getElementById('input').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 200) + 'px';
    });
    loadChats();
  </script>
</body>
</html>
