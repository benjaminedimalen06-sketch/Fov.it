<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fov.it — My Pastes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
    .navbar { background: #141414; border-bottom: 1px solid #222; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .logo { color: #00ff88; font-size: 20px; font-weight: bold; }
    .user-info { display: flex; align-items: center; gap: 16px; font-size: 13px; color: #aaa; }
    .badge { background: #00ff88; color: #0a0a0a; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
    .logout-btn { background: #222; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .logout-btn:hover { background: #ff4444; }
    .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { color: #fff; font-size: 24px; }
    .new-btn { background: #00ff88; color: #0a0a0a; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; text-decoration: none; }
    .new-btn:hover { background: #00cc6a; }
    .owner-banner { background: #1a2a1a; border: 1px solid #00ff88; color: #00ff88; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; }
    
    /* PASTEBIN STYLE TABLE */
    .pastes-table { width: 100%; border-collapse: collapse; background: #141414; border-radius: 8px; overflow: hidden; }
    .pastes-table thead { background: #1a1a1a; }
    .pastes-table th { text-align: left; padding: 14px 16px; font-size: 12px; color: #00ff88; text-transform: uppercase; border-bottom: 1px solid #222; }
    .pastes-table td { padding: 14px 16px; font-size: 13px; color: #ccc; border-bottom: 1px solid #1a1a1a; }
    .pastes-table tbody tr:hover { background: #1a1a1a; }
    .pastes-table .title { color: #00ff88; font-weight: bold; cursor: pointer; }
    .pastes-table .title:hover { text-decoration: underline; }
    .pastes-table .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    
    .btn { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 11px; font-weight: bold; text-decoration: none; display: inline-block; }
    .btn-edit { background: #222; color: #00ff88; }
    .btn-edit:hover { background: #00ff88; color: #0a0a0a; }
    .btn-copy { background: #222; color: #fff; }
    .btn-copy:hover { background: #444; }
    .btn-raw { background: #00ff88; color: #0a0a0a; }
    .btn-raw:hover { background: #00cc6a; }
    .btn-delete { background: #222; color: #ff4444; }
    .btn-delete:hover { background: #ff4444; color: #fff; }
    .btn-view { background: #222; color: #fff; }
    .btn-view:hover { background: #444; }
    
    .empty { text-align: center; color: #666; padding: 60px 20px; background: #141414; border: 1px dashed #222; border-radius: 8px; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #00ff88; color: #0a0a0a; padding: 12px 20px; border-radius: 6px; font-weight: bold; display: none; z-index: 999; }
    
    .raw-link-box { 
      background: #0a2a0a; border: 1px solid #00ff88; color: #00ff88; 
      padding: 10px 14px; border-radius: 6px; margin-top: 8px; 
      font-size: 11px; word-break: break-all; font-family: 'Consolas', monospace;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="logo">Fov.it</div>
    <div class="user-info">
      <span id="username">...</span>
      <span class="badge" id="roleBadge">...</span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="container">
    <div id="ownerBanner" class="owner-banner" style="display:none;">
      👑 Ikaw ang OWNER — Makikita mo lahat ng scripts ng lahat ng users.
    </div>

    <div class="header">
      <h1>📋 My Pastes</h1>
      <a href="/editor.html" class="new-btn">+ Bagong Script</a>
    </div>

    <div id="scriptsList"></div>
  </div>
  <div class="toast" id="toast">Copied!</div>

  <script>
    const user = JSON.parse(localStorage.getItem('fov_user') || '{}');
    if (!localStorage.getItem('fov_token')) window.location.href = '/';

    document.getElementById('username').textContent = user.name || '?';
    document.getElementById('roleBadge').textContent = user.role || 'user';

    if (user.role === 'owner') {
      document.getElementById('ownerBanner').style.display = 'block';
    }

    async function loadScripts() {
      const list = document.getElementById('scriptsList');
      list.innerHTML = '<div class="empty">Loading...</div>';

      try {
        const res = await fetch('/api/list');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        if (data.scripts.length === 0) {
          list.innerHTML = '<div class="empty">Wala pang scripts. Click "+ Bagong Script" para gumawa.</div>';
          return;
        }

        list.innerHTML = `
          <table class="pastes-table">
            <thead>
              <tr>
                <th>Name / Title</th>
                <th>Added</th>
                <th>Raw Link</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${data.scripts.map(s => {
                const rawLink = window.location.origin + '/api/raw?id=' + s.public_link;
                const viewLink = window.location.origin + '/s/' + s.public_link;
                const date = new Date(s.created_at).toLocaleDateString('en-US', { 
                  month: 'short', day: 'numeric', year: 'numeric' 
                });
                return `
                  <tr>
                    <td>
                      <span class="title" onclick="window.open('${viewLink}', '_blank')">
                        ${escapeHtml(s.title)}
                      </span>
                    </td>
                    <td>${date}</td>
                    <td>
                      <div class="raw-link-box">/api/raw?id=${s.public_link}</div>
                    </td>
                    <td>
                      <div class="actions">
                        <button class="btn btn-raw" onclick="copyRaw('${rawLink}')">📋 Copy Raw</button>
                        <a href="/editor.html?id=${s.id}" class="btn btn-edit">✏️ Edit</a>
                        <button class="btn btn-copy" onclick="window.open('${viewLink}', '_blank')">👁️ View</button>
                        <button class="btn btn-delete" onclick="deleteScript('${s.id}')">🗑️ Delete</button>
                      </div>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;

      } catch (err) {
        list.innerHTML = '<div class="empty">Error: ' + err.message + '</div>';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function copyRaw(rawLink) {
      const loadstring = `loadstring(game:HttpGet("${rawLink}"))()`;
      navigator.clipboard.writeText(loadstring);
      showToast('Copied: ' + loadstring);
    }

    async function deleteScript(id) {
      if (!confirm('Sigurado ka bang gusto mong burahin ito?')) return;
      try {
        const res = await fetch('/api/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showToast('Deleted!');
        loadScripts();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    function logout() {
      localStorage.removeItem('fov_token');
      localStorage.removeItem('fov_user');
      window.location.href = '/';
    }

    loadScripts();
  </script>
</body>
</html>
