<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fov.it — Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
    .navbar { background: #141414; border-bottom: 1px solid #222; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .logo { color: #00ff88; font-size: 20px; font-weight: bold; }
    .user-info { display: flex; align-items: center; gap: 16px; font-size: 13px; color: #aaa; }
    .badge { background: #00ff88; color: #0a0a0a; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
    .logout-btn { background: #222; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .logout-btn:hover { background: #ff4444; }
    .container { max-width: 1000px; margin: 0 auto; padding: 32px 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { color: #fff; font-size: 24px; }
    .owner-banner { background: #1a2a1a; border: 1px solid #00ff88; color: #00ff88; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; }
    .upload-box { background: #141414; border: 1px solid #222; border-radius: 8px; padding: 24px; margin-bottom: 24px; }
    .upload-box h2 { color: #00ff88; font-size: 16px; margin-bottom: 16px; }
    .upload-box input, .upload-box textarea { width: 100%; padding: 10px; background: #0a0a0a; border: 1px solid #222; border-radius: 6px; color: #fff; font-size: 13px; outline: none; margin-bottom: 12px; font-family: inherit; }
    .upload-box input:focus, .upload-box textarea:focus { border-color: #00ff88; }
    .upload-box textarea { min-height: 150px; font-family: 'Consolas', 'Monaco', monospace; resize: vertical; }
    .upload-btn { background: #00ff88; color: #0a0a0a; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .upload-btn:hover { background: #00cc6a; }
    .upload-btn:disabled { background: #444; cursor: not-allowed; }
    .raw-result { background: #0a2a0a; border: 1px solid #00ff88; color: #00ff88; padding: 12px; border-radius: 6px; margin-top: 12px; font-size: 12px; word-break: break-all; display: none; }
    .raw-result code { color: #fff; background: #0a0a0a; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-top: 6px; }
    .script-card { background: #141414; border: 1px solid #222; border-radius: 8px; padding: 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .script-card:hover { border-color: #00ff88; }
    .script-info h3 { color: #fff; font-size: 16px; margin-bottom: 6px; }
    .script-meta { color: #666; font-size: 12px; }
    .script-meta span { color: #00ff88; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-edit { background: #222; color: #00ff88; }
    .btn-edit:hover { background: #00ff88; color: #0a0a0a; }
    .btn-copy { background: #222; color: #fff; }
    .btn-copy:hover { background: #444; }
    .btn-raw { background: #00ff88; color: #0a0a0a; }
    .btn-raw:hover { background: #00cc6a; }
    .btn-delete { background: #222; color: #ff4444; }
    .btn-delete:hover { background: #ff4444; color: #fff; }
    .empty { text-align: center; color: #666; padding: 60px 20px; background: #141414; border: 1px dashed #222; border-radius: 8px; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #00ff88; color: #0a0a0a; padding: 12px 20px; border-radius: 6px; font-weight: bold; display: none; z-index: 999; }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="logo">Fov.it</div>
    <div class="user-info">
      <span id="username">...</span>
      <span class="badge" id="roleBadge">...</span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="container">
    <div id="ownerBanner" class="owner-banner" style="display:none;">
      👑 Ikaw ang OWNER — Makikita mo lahat ng scripts ng lahat ng users.
    </div>

    <div class="upload-box">
      <h2>📤 Upload Script (Raw Link)</h2>
      <input type="text" id="uploadTitle" placeholder="Script Name (Title)">
      <textarea id="uploadContent" placeholder="-- I-paste ang Lua script dito..."></textarea>
      <button class="upload-btn" id="uploadBtn" onclick="uploadScript()">Upload & Get Raw Link</button>
      <div class="raw-result" id="rawResult"></div>
    </div>

    <div class="header">
      <h1 id="pageTitle">Aking Scripts</h1>
    </div>
    <div id="scriptsList"></div>
  </div>
  <div class="toast" id="toast">Copied!</div>

  <script>
    const user = JSON.parse(localStorage.getItem('fov_user') || '{}');

    document.getElementById('username').textContent = user.name || '?';
    document.getElementById('roleBadge').textContent = user.role || 'user';

    if (user.role === 'owner') {
      document.getElementById('ownerBanner').style.display = 'block';
    }

    async function uploadScript() {
      const btn = document.getElementById('uploadBtn');
      const title = document.getElementById('uploadTitle').value.trim();
      const content = document.getElementById('uploadContent').value;

      if (!title || !content) {
        alert('Fill up title at content');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Uploading...';

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content, owner: user.name })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        // I-save sa localStorage para sa dashboard list
        let scripts = JSON.parse(localStorage.getItem('fov_scripts') || '[]');
        scripts.push({
          id: 'id_' + Date.now(),
          title: title,
          content: content,
          link: data.link,
          owner: user.name,
          created: new Date().toISOString()
        });
        localStorage.setItem('fov_scripts', JSON.stringify(scripts));

        // Ipakita ang raw link
        const rawResult = document.getElementById('rawResult');
        rawResult.style.display = 'block';
        rawResult.innerHTML = `
          ✅ <strong>Script uploaded!</strong><br><br>
          <strong>Raw Link:</strong><br>
          <code>${data.raw_link}</code><br><br>
          <strong>Para gamitin sa Roblox:</strong><br>
          <code>loadstring(game:HttpGet("${data.raw_link}"))()</code>
        `;

        document.getElementById('uploadTitle').value = '';
        document.getElementById('uploadContent').value = '';

        showToast('Uploaded!');
        loadScripts();
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Upload & Get Raw Link';
      }
    }

    function loadScripts() {
      const scripts = JSON.parse(localStorage.getItem('fov_scripts') || '[]');
      const list = document.getElementById('scriptsList');
      if (scripts.length === 0) {
        list.innerHTML = '<div class="empty">Wala pang scripts. Upload sa taas.</div>';
        return;
      }
      list.innerHTML = scripts.map(s => {
        const rawLink = window.location.origin + '/api/raw?id=' + s.link;
        return `
        <div class="script-card">
          <div class="script-info">
            <h3>${escapeHtml(s.title)}</h3>
            <div class="script-meta">
              May-ari: <span>${escapeHtml(s.owner || 'you')}</span> · 
              Link: <span>/s/${s.link}</span>
            </div>
          </div>
          <div class="actions">
            <button class="btn btn-copy" onclick="copyLink('${s.link}')">Copy Link</button>
            <button class="btn btn-raw" onclick="copyRaw('${rawLink}')">Copy Raw</button>
            <button class="btn btn-edit" onclick="editScript('${s.id}')">Edit</button>
            <button class="btn btn-delete" onclick="deleteScript('${s.id}')">Delete</button>
          </div>
        </div>
      `}).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function copyLink(link) {
      const full = window.location.origin + '/s/' + link;
      navigator.clipboard.writeText(full);
      showToast('Link copied!');
    }

    function copyRaw(rawLink) {
      navigator.clipboard.writeText('loadstring(game:HttpGet("' + rawLink + '"))()');
      showToast('Raw loadstring copied!');
    }

    function editScript(id) {
      window.location.href = '/editor.html?id=' + id;
    }

    function deleteScript(id) {
      if (!confirm('Burahin?')) return;
      let scripts = JSON.parse(localStorage.getItem('fov_scripts') || '[]');
      scripts = scripts.filter(s => s.id !== id);
      localStorage.setItem('fov_scripts', JSON.stringify(scripts));
      loadScripts();
      showToast('Deleted!');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2500);
    }

    function logout() {
      localStorage.removeItem('fov_token');
      localStorage.removeItem('fov_user');
      window.location.href = '/';
    }

    loadScripts();
  </script>
</body>
</html>
