<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fov.it — Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
    }
    .navbar {
      background: #141414;
      border-bottom: 1px solid #222;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { color: #00ff88; font-size: 20px; font-weight: bold; }
    .user-info { display: flex; align-items: center; gap: 16px; font-size: 13px; color: #aaa; }
    .badge {
      background: #00ff88;
      color: #0a0a0a;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .logout-btn {
      background: #222;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .logout-btn:hover { background: #ff4444; }
    .container { max-width: 1000px; margin: 0 auto; padding: 32px 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { color: #fff; font-size: 24px; }
    .new-btn {
      background: #00ff88;
      color: #0a0a0a;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    .new-btn:hover { background: #00cc6a; }
    .owner-banner {
      background: #1a2a1a;
      border: 1px solid #00ff88;
      color: #00ff88;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
    }
    .script-card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.2s;
    }
    .script-card:hover { border-color: #00ff88; }
    .script-info h3 { color: #fff; font-size: 16px; margin-bottom: 6px; }
    .script-meta { color: #666; font-size: 12px; }
    .script-meta span { color: #00ff88; }
    .actions { display: flex; gap: 8px; }
    .btn {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }
    .btn-edit { background: #222; color: #00ff88; }
    .btn-edit:hover { background: #00ff88; color: #0a0a0a; }
    .btn-copy { background: #222; color: #fff; }
    .btn-copy:hover { background: #444; }
    .btn-delete { background: #222; color: #ff4444; }
    .btn-delete:hover { background: #ff4444; color: #fff; }
    .empty {
      text-align: center;
      color: #666;
      padding: 60px 20px;
      background: #141414;
      border: 1px dashed #222;
      border-radius: 8px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #00ff88;
      color: #0a0a0a;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: bold;
      display: none;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="logo">Fov.it</div>
    <div class="user-info">
      <span id="username">...</span>
      <span class="badge" id="roleBadge">...</span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div id="ownerBanner" class="owner-banner" style="display:none;">
      👑 Ikaw ang OWNER — Makikita mo lahat ng scripts ng lahat ng users. Pwede mong i-edit ang kahit anong script.
    </div>

    <div class="header">
      <h1 id="pageTitle">Aking Scripts</h1>
      <button class="new-btn" onclick="window.location.href='/editor.html'">+ Bagong Script</button>
    </div>

    <div id="scriptsList"></div>
  </div>

  <div class="toast" id="toast">Copied!</div>

  <script>
    const token = localStorage.getItem('fov_token');
    const user = JSON.parse(localStorage.getItem('fov_user') || '{}');

    if (!token) window.location.href = '/';

    document.getElementById('username').textContent = user.username || '?';
    document.getElementById('roleBadge').textContent = user.role || 'user';

    if (user.role === 'owner') {
      document.getElementById('ownerBanner').style.display = 'block';
      document.getElementById('pageTitle').textContent = 'Lahat ng Scripts (Owner View)';
    }

    let allScripts = [];

    async function loadScripts() {
      try {
        const res = await fetch('/api/scripts', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        allScripts = data.scripts;
        renderScripts();
      } catch (err) {
        document.getElementById('scriptsList').innerHTML =
          '<div class="empty">Error: ' + err.message + '</div>';
      }
    }

    function renderScripts() {
      const list = document.getElementById('scriptsList');
      if (allScripts.length === 0) {
        list.innerHTML = '<div class="empty">Wala pang scripts. Click "+ Bagong Script" para gumawa.</div>';
        return;
      }
      list.innerHTML = allScripts.map(s => `
        <div class="script-card">
          <div class="script-info">
            <h3>${escapeHtml(s.title)}</h3>
            <div class="script-meta">
              ${s.owner_username ? 'May-ari: <span>' + escapeHtml(s.owner_username) + '</span> · ' : ''}
              Link: <span>/s/${s.public_link}</span> · Updated: ${new Date(s.updated_at).toLocaleString()}
            </div>
          </div>
          <div class="actions">
            <button class="btn btn-copy" onclick="copyLink('${s.public_link}')">Copy Link</button>
            <button class="btn btn-edit" onclick="editScript('${s.id}')">Edit</button>
            <button class="btn btn-delete" onclick="deleteScript('${s.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function copyLink(link) {
      const full = window.location.origin + '/s/' + link;
      navigator.clipboard.writeText(full);
      showToast('Link copied: ' + full);
    }

    function editScript(id) {
      window.location.href = '/editor.html?id=' + id;
    }

    async function deleteScript(id) {
      if (!confirm('Sigurado ka bang gusto mong burahin ito?')) return;
      try {
        const res = await fetch('/api/scripts', {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ id })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showToast('Deleted!');
        loadScripts();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2500);
    }

    function logout() {
      localStorage.removeItem('fov_token');
      localStorage.removeItem('fov_user');
      window.location.href = '/';
    }

    loadScripts();
  </script>
</body>
</html>
