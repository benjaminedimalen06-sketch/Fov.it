<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fov.it — Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #050505;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 255, 136, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 255, 136, 0.05) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }
    .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.15; pointer-events: none; z-index: 0; }
    .orb-1 { width: 400px; height: 400px; background: #00ff88; top: -100px; left: -100px; animation: float1 15s ease-in-out infinite; }
    .orb-2 { width: 300px; height: 300px; background: #00cc6a; bottom: -50px; right: -50px; animation: float2 12s ease-in-out infinite; }
    @keyframes float1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(100px, 100px); } }
    @keyframes float2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-80px, -60px); } }
    .navbar { background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(30px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 900; letter-spacing: -0.5px; background: linear-gradient(135deg, #fff 0%, #00ff88 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #00ff88, #00cc6a); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; color: #0a0a0a; box-shadow: 0 0 30px rgba(0, 255, 136, 0.5); }
    .user-info { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #aaa; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #00ff88, #00cc6a); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #0a0a0a; font-size: 14px; box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }
    .badge { background: linear-gradient(135deg, #00ff88, #00cc6a); color: #0a0a0a; padding: 5px 14px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 20px rgba(0, 255, 136, 0.3); }
    .admin-btn { background: linear-gradient(135deg, #ff4444, #cc0000); color: #fff; padding: 8px 18px; border-radius: 10px; text-decoration: none; font-size: 12px; font-weight: 700; transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px; }
    .admin-btn:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 10px 30px rgba(255, 68, 68, 0.5); }
    .logout-btn { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 18px; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 700; transition: all 0.3s; font-family: inherit; }
    .logout-btn:hover { background: #ff4444; border-color: #ff4444; transform: translateY(-2px); }
    .container { max-width: 1300px; margin: 0 auto; padding: 48px 32px; position: relative; z-index: 1; }
    .hero { text-align: center; margin-bottom: 48px; animation: fadeUp 0.6s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .hero h1 { font-size: 48px; font-weight: 900; letter-spacing: -2px; margin-bottom: 12px; background: linear-gradient(135deg, #fff 0%, #00ff88 50%, #fff 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: shine 4s linear infinite; }
    @keyframes shine { to { background-position: 200% center; } }
    .hero p { color: #666; font-size: 15px; margin-bottom: 24px; }
    .hero-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .new-btn { background: linear-gradient(135deg, #00ff88, #00cc6a); color: #0a0a0a; border: none; padding: 16px 32px; border-radius: 14px; font-weight: 800; cursor: pointer; font-size: 15px; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; transition: all 0.3s; box-shadow: 0 10px 40px rgba(0, 255, 136, 0.3); font-family: inherit; }
    .new-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 20px 60px rgba(0, 255, 136, 0.5); }
    .ai-btn { background: linear-gradient(135deg, #a78bfa, #7c3aed); color: #fff; border: none; padding: 16px 32px; border-radius: 14px; font-weight: 800; cursor: pointer; font-size: 15px; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; transition: all 0.3s; box-shadow: 0 10px 40px rgba(167, 139, 250, 0.3); font-family: inherit; }
    .ai-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 20px 60px rgba(167, 139, 250, 0.5); }
    .owner-banner { background: linear-gradient(135deg, rgba(255, 68, 68, 0.15), rgba(255, 68, 68, 0.05)); border: 1px solid rgba(255, 68, 68, 0.3); color: #ff8888; padding: 18px 24px; border-radius: 16px; margin-bottom: 32px; font-size: 14px; display: flex; align-items: center; gap: 12px; backdrop-filter: blur(20px); animation: fadeUp 0.6s ease 0.1s both; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 48px; }
    .stat-card { background: linear-gradient(135deg, rgba(20, 20, 20, 0.8), rgba(15, 15, 15, 0.8)); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 28px; transition: all 0.4s; position: relative; overflow: hidden; animation: fadeUp 0.6s ease both; }
    .stat-card:nth-child(1) { animation-delay: 0.1s; }
    .stat-card:nth-child(2) { animation-delay: 0.2s; }
    .stat-card:nth-child(3) { animation-delay: 0.3s; }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #00ff88, #00cc6a); opacity: 0; transition: opacity 0.4s; }
    .stat-card:hover { transform: translateY(-6px); border-color: rgba(0, 255, 136, 0.3); box-shadow: 0 20px 60px rgba(0, 255, 136, 0.15); }
    .stat-card:hover::before { opacity: 1; }
    .stat-card .label { color: #666; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; font-weight: 600; }
    .stat-card .value { color: #00ff88; font-size: 36px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
    .stat-card .value.small { font-size: 20px; }
    .section-title { margin-bottom: 24px; }
    .section-title h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    .scripts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }
    .script-card { background: linear-gradient(135deg, rgba(20, 20, 20, 0.9), rgba(15, 15, 15, 0.9)); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 28px; transition: all 0.4s; position: relative; overflow: hidden; animation: fadeUp 0.6s ease both; }
    .script-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #00ff88, #00cc6a); opacity: 0; transition: opacity 0.4s; }
    .script-card:hover { transform: translateY(-6px); border-color: rgba(0, 255, 136, 0.4); box-shadow: 0 25px 70px rgba(0, 255, 136, 0.2); }
    .script-card:hover::before { opacity: 1; }
    .script-card h3 { color: #fff; font-size: 18px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
    .script-icon { width: 32px; height: 32px; background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 255, 136, 0.05)); border: 1px solid rgba(0, 255, 136, 0.3); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .script-card .meta { color: #666; font-size: 12px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; }
    .script-card .meta span { display: inline-flex; align-items: center; gap: 4px; color: #888; }
    .script-card .meta .highlight { color: #00ff88; font-weight: 600; }
    .script-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { padding: 10px 16px; border-radius: 10px; border: none; cursor: pointer; font-size: 11px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.25s; font-family: inherit; }
    .btn-raw { background: linear-gradient(135deg, #00ff88, #00cc6a); color: #0a0a0a; }
    .btn-raw:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 255, 136, 0.5); }
    .btn-edit { background: rgba(255, 255, 255, 0.05); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.3); }
    .btn-edit:hover { background: #00ff88; color: #0a0a0a; transform: translateY(-2px); }
    .btn-view { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-view:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }
    .btn-delete { background: rgba(255, 68, 68, 0.1); color: #ff6666; border: 1px solid rgba(255, 68, 68, 0.3); }
    .btn-delete:hover { background: #ff4444; color: #fff; transform: translateY(-2px); }
    .empty { text-align: center; color: #666; padding: 100px 20px; background: linear-gradient(135deg, rgba(20, 20, 20, 0.5), rgba(15, 15, 15, 0.5)); backdrop-filter: blur(20px); border: 1px dashed rgba(255, 255, 255, 0.1); border-radius: 24px; }
    .empty-icon { font-size: 64px; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .empty h3 { color: #fff; margin-bottom: 8px; font-size: 20px; font-weight: 700; }
    .empty p { font-size: 14px; }
    .toast { position: fixed; bottom: 32px; right: 32px; background: linear-gradient(135deg, #00ff88, #00cc6a); color: #0a0a0a; padding: 16px 28px; border-radius: 14px; font-weight: 800; font-size: 14px; display: none; z-index: 999; box-shadow: 0 20px 60px rgba(0, 255, 136, 0.5); }
    @media (max-width: 768px) {
      .navbar { padding: 14px 20px; }
      .container { padding: 32px 20px; }
      .hero h1 { font-size: 32px; }
      .user-info { gap: 8px; font-size: 11px; }
      .badge, .admin-btn, .logout-btn { padding: 6px 10px; font-size: 10px; }
      .scripts-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="navbar">
    <div class="logo">
      <div class="logo-icon">F</div>
      Fov.it
    </div>
    <div class="user-info">
      <div class="user-avatar" id="userAvatar">?</div>
      <span id="username">...</span>
      <span class="badge" id="roleBadge">...</span>
      <a href="/admin.html" id="adminBtn" class="admin-btn" style="display:none;">🔐 Admin</a>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="container">
    <div id="ownerBanner" class="owner-banner" style="display:none;">
      👑 <strong>You are the OWNER</strong> — You can see all scripts from all users.
    </div>
    <div class="hero">
      <h1>My Pastes</h1>
      <p>All your protected Lua scripts</p>
      <div class="hero-buttons">
        <a href="/editor.html" class="new-btn">✨ New Script</a>
        <a href="/ai.html" class="ai-btn">🤖 AI Generator</a>
      </div>
    </div>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="section-title">
      <h2>📋 Your Scripts</h2>
    </div>
    <div id="scriptsList"></div>
  </div>
  <div class="toast" id="toast">Copied!</div>
  <script>
    const token = localStorage.getItem('fov_token');
    const user = JSON.parse(localStorage.getItem('fov_user') || '{}');
    if (!token) window.location.href = '/';
    document.getElementById('username').textContent = user.name || '?';
    document.getElementById('roleBadge').textContent = user.role || 'user';
    document.getElementById('userAvatar').textContent = (user.name || '?')[0].toUpperCase();
    if (user.role === 'owner') {
      document.getElementById('ownerBanner').style.display = 'flex';
      document.getElementById('adminBtn').style.display = 'inline-flex';
    }
    async function loadScripts() {
      const list = document.getElementById('scriptsList');
      const statsGrid = document.getElementById('statsGrid');
      list.innerHTML = '<div class="empty"><div class="empty-icon">⏳</div><h3>Loading...</h3></div>';
      statsGrid.innerHTML = '';
      try {
        const res = await fetch('/api/list', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        statsGrid.innerHTML = `
          <div class="stat-card">
            <div class="label">Total Scripts</div>
            <div class="value">${data.scripts.length}</div>
          </div>
          <div class="stat-card">
            <div class="label">Account Role</div>
            <div class="value small">${(user.role || 'user').toUpperCase()}</div>
          </div>
          <div class="stat-card">
            <div class="label">Username</div>
            <div class="value small">${escapeHtml(user.name || '?')}</div>
          </div>
        `;
        if (data.scripts.length === 0) {
          list.innerHTML = `
            <div class="empty">
              <div class="empty-icon">📝</div>
              <h3>No scripts yet</h3>
              <p>Click "✨ New Script" to create your first script.</p>
            </div>
          `;
          return;
        }
        list.innerHTML = `
          <div class="scripts-grid">
            ${data.scripts.map((s, i) => {
              const date = new Date(s.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
              const rawLink = window.location.origin + '/api/raw?id=' + s.public_link;
              const viewLink = rawLink + '&token=' + token;
              return `
                <div class="script-card" style="animation-delay: ${i * 0.05}s;">
                  <h3>
                    <div class="script-icon">📄</div>
                    ${escapeHtml(s.title)}
                  </h3>
                  <div class="meta">
                    <span>📅 ${date}</span>
                    <span class="highlight">🔗 /s/${s.public_link}</span>
                  </div>
                  <div class="script-actions">
                    <button class="btn btn-raw" onclick="copyRaw('${rawLink}')">📋 Copy Raw</button>
                    <a href="/editor.html?id=${s.id}" class="btn btn-edit">✏️ Edit</a>
                    <a href="${viewLink}" target="_blank" class="btn btn-view">👁️ View</a>
                    <button class="btn btn-delete" onclick="deleteScript('${s.id}')">🗑️ Delete</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } catch (err) {
        list.innerHTML = '<div class="empty"><div class="empty-icon">❌</div><h3>Error</h3><p>' + err.message + '</p></div>';
      }
    }
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }
    function copyRaw(rawLink) {
      const loadstring = `loadstring(game:HttpGet("${rawLink}"))()`;
      navigator.clipboard.writeText(loadstring).then(() => {
        showToast('✅ Copied loadstring!');
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = loadstring;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('✅ Copied loadstring!');
      });
    }
    async function deleteScript(id) {
      if (!confirm('Are you sure you want to delete this?')) return;
      try {
        const res = await fetch('/api/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ id })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showToast('🗑️ Deleted!');
        loadScripts();
      } catch (err) { alert('Error: ' + err.message); }
    }
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }
    function logout() {
      localStorage.removeItem('fov_token');
      localStorage.removeItem('fov_user');
      window.location.href = '/';
    }
    loadScripts();
  </script>
</body>
</html>
